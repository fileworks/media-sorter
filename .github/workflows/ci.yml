name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manually triggering CI checks

# Cancel any in-flight run for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: lint / typecheck / test ────────────────────────────────────────
  backend:
    name: Backend — lint / typecheck / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libjpeg-dev libpng-dev

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify deterministic branding
        run: make branding-check

      - name: Lint — ruff
        working-directory: backend
        run: python -m ruff check app tests

      - name: Format check — ruff
        working-directory: backend
        run: python -m ruff format --check app tests

      - name: Type-check — mypy
        working-directory: backend
        run: python -m mypy app

      - name: Run tests with coverage
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  backend-windows:
    name: Backend — Windows path / DirectML contracts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Windows identity and provider tests
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_utils/test_path_utils.py
          tests/test_services/test_hardware.py
          -v

  # ── Frontend: typecheck / build ──────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No Rust needed here: `tsc --noEmit` and `vite build` are pure TS/JS steps.
      # Tauri TS types come from the @tauri-apps/api npm package, not Rust compilation.
      # Rust is only needed for `make build-tauri` (the release jobs).

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint — ESLint
        working-directory: frontend
        run: npm run lint

      - name: Format check — Prettier
        working-directory: frontend
        run: npm run format:check

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build (Vite — no Tauri binary needed in CI)
        working-directory: frontend
        run: npm run build

      - name: Validate tauri.conf.json schema
        working-directory: frontend
        run: |
          pip install jsonschema --quiet --disable-pip-version-check
          python3 - <<'EOF'
          import json, jsonschema, sys
          schema = json.load(open("node_modules/@tauri-apps/cli/schema.json"))
          config = json.load(open("src-tauri/tauri.conf.json"))
          try:
              jsonschema.validate(config, schema)
              print("tauri.conf.json is valid")
          except jsonschema.ValidationError as e:
              path = " > ".join(str(p) for p in e.absolute_path)
              print(f"ERROR in tauri.conf.json at '{path}': {e.message}", file=sys.stderr)
              sys.exit(1)
          EOF

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked --all-extras --dev
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: dependency-audit
        run: uv run pip-audit --strict

  release-integrity:
    name: release-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: release-integrity
        shell: python
        run: |
          import json, pathlib, re, sys

          found = {}

          package_json = pathlib.Path("frontend/package.json")
          if package_json.is_file():
              found["frontend/package.json"] = json.loads(package_json.read_text())["version"]

          tauri = pathlib.Path("frontend/src-tauri/tauri.conf.json")
          if tauri.is_file():
              config = json.loads(tauri.read_text())
              version = config.get("version") or config.get("package", {}).get("version")
              if version:
                  found["tauri.conf.json"] = version

          version_py = pathlib.Path("backend/app/_version.py")
          if version_py.is_file():
              match = re.search(r'__version__\s*=\s*"([^"]+)"', version_py.read_text())
              if match:
                  found["backend/app/_version.py"] = match.group(1)

          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.is_file():
              match = re.search(r"(\d+\.\d+\.\d+)", changelog.read_text())
              if match:
                  found["CHANGELOG.md"] = match.group(1)

          if not found:
              print("no version sources found")
              sys.exit(1)

          for source, version in sorted(found.items()):
              print(f"{source}: {version}")

          distinct = set(found.values())
          if len(distinct) > 1:
              print(f"\nversions disagree: {sorted(distinct)}")
              sys.exit(1)
          print("\nevery version source agrees")
