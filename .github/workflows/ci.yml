name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manually triggering CI checks

# Cancel any in-flight run for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: lint / typecheck / test ────────────────────────────────────────
  backend:
    name: Backend — lint / typecheck / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libjpeg-dev libpng-dev

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify deterministic branding
        run: make branding-check

      - name: Report reviewed module growth
        run: python scripts/check_module_growth.py

      - name: Lint — ruff
        working-directory: backend
        run: python -m ruff check app tests

      - name: Format check — ruff
        working-directory: backend
        run: python -m ruff format --check app tests

      - name: Type-check — mypy
        working-directory: backend
        run: python -m mypy app

      - name: Run tests with coverage
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  backend-windows:
    name: Backend — Windows path / DirectML contracts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Windows identity and provider tests
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_utils/test_path_utils.py
          tests/test_services/test_hardware.py
          -v

  backend-types:
    name: backend-types (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            extras: dev
          - profile: shipped-local-ai
            extras: dev,local-ai
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install profile
        working-directory: backend
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Type-check the shipped import graph
        working-directory: backend
        run: python -m mypy app

  archive-security:
    name: Archive security — ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the test runner
        run: python -m pip install pytest

      # Repo root, not backend/: this exercises scripts/fetch_ffmpeg.py with
      # nothing but pytest installed, and backend/tests/conftest.py imports
      # FastAPI, so collecting from there failed before a single test ran.
      - name: Exercise malicious archives on the native filesystem
        run: python -m pytest tests/test_fetch_ffmpeg.py -v

  # ── Frontend: typecheck / build ──────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No Rust needed here: `tsc --noEmit` and `vite build` are pure TS/JS steps.
      # Tauri TS types come from the @tauri-apps/api npm package, not Rust compilation.
      # Rust is only needed for `make build-tauri` (the release jobs).

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint — ESLint
        working-directory: frontend
        run: npm run lint

      - name: Format check — Prettier
        working-directory: frontend
        run: npm run format:check

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build (Vite — no Tauri binary needed in CI)
        working-directory: frontend
        run: npm run build

      - name: Validate tauri.conf.json schema
        working-directory: frontend
        run: |
          pip install jsonschema --quiet --disable-pip-version-check
          python3 - <<'EOF'
          import json, jsonschema, sys
          schema = json.load(open("node_modules/@tauri-apps/cli/schema.json"))
          config = json.load(open("src-tauri/tauri.conf.json"))
          try:
              jsonschema.validate(config, schema)
              print("tauri.conf.json is valid")
          except jsonschema.ValidationError as e:
              path = " > ".join(str(p) for p in e.absolute_path)
              print(f"ERROR in tauri.conf.json at '{path}': {e.message}", file=sys.stderr)
              sys.exit(1)
          EOF

  native:
    name: native
    # MediaSorter ships macOS and Windows bundles. Building the Tauri 1 Linux
    # GTK graph here would add an unshipped platform and require legacy system
    # libraries, so exercise the native source on a shipped host instead.
    runs-on: macos-latest
    env:
      # Source compilation must not depend on release-sized generated payloads.
      # Release jobs use the canonical config after creating every resource.
      TAURI_CONFIG: '{"tauri":{"bundle":{"resources":[]}}}'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check
      - name: Compile native source from a clean checkout
        working-directory: frontend/src-tauri
        run: cargo check --locked
      - name: Test native source from a clean checkout
        working-directory: frontend/src-tauri
        run: cargo test --locked

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: Export the shipped Python dependency set
        working-directory: ${{ hashFiles('backend/uv.lock') != '' && 'backend' || '.' }}
        run: >-
          uv export --locked --all-extras --no-dev --no-emit-project
          --format requirements-txt
          --output-file dependency-audit-requirements.txt
      - name: Python dependency audit (pip-audit 2.9.0)
        working-directory: ${{ hashFiles('backend/uv.lock') != '' && 'backend' || '.' }}
        run: |
          uvx --from pip-audit==2.9.0 pip-audit --version
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement dependency-audit-requirements.txt --strict
      - name: Frontend production dependency audit
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm --version
          npm audit --omit=dev --audit-level=high
      - name: Validate reviewed dependency suppressions
        if: hashFiles('dependency-audit-suppressions.json') != ''
        run: python scripts/validate_dependency_suppressions.py --check
      - name: Rust dependency audit (cargo-audit 0.22.2)
        if: hashFiles('frontend/src-tauri/Cargo.lock') != ''
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          audit_args=()
          if [[ -f ../../dependency-audit-suppressions.json ]]; then
            while IFS= read -r advisory; do
              audit_args+=(--ignore "$advisory")
            done < <(python ../../scripts/validate_dependency_suppressions.py --ecosystem rust)
          fi
          cargo audit --version
          cargo audit "${audit_args[@]}"

  release-integrity:
    name: release-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: release-integrity
        shell: python
        run: |
          import json, pathlib, re, sys

          found = {}

          package_json = pathlib.Path("frontend/package.json")
          if package_json.is_file():
              found["frontend/package.json"] = json.loads(package_json.read_text())["version"]

          tauri = pathlib.Path("frontend/src-tauri/tauri.conf.json")
          if tauri.is_file():
              config = json.loads(tauri.read_text())
              version = config.get("version") or config.get("package", {}).get("version")
              if version:
                  found["tauri.conf.json"] = version

          version_py = pathlib.Path("backend/app/_version.py")
          if version_py.is_file():
              match = re.search(r'__version__\s*=\s*"([^"]+)"', version_py.read_text())
              if match:
                  found["backend/app/_version.py"] = match.group(1)

          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.is_file():
              match = re.search(r"(\d+\.\d+\.\d+)", changelog.read_text())
              if match:
                  found["CHANGELOG.md"] = match.group(1)

          if not found:
              print("no version sources found")
              sys.exit(1)

          for source, version in sorted(found.items()):
              print(f"{source}: {version}")

          distinct = set(found.values())
          if len(distinct) > 1:
              print(f"\nversions disagree: {sorted(distinct)}")
              sys.exit(1)
          print("\nevery version source agrees")
