name: Version Release

# Runs only after an explicitly reviewed manual dispatch. If the selected main
# history contains a `feat:` or `fix:` (or a breaking change), release-it:
#   1. computes the next version from Conventional Commits,
#   2. syncs that version into the app (scripts/sync-version.mjs),
#   3. updates CHANGELOG.md,
#   4. commits those files back to main and creates a `v<version>` git tag.
#
# The tag is what drives release.yml (which builds + publishes the installers).
#
# Before anything is tagged, the dispatched main commit must already have a green
# unpublished Release candidate (`gh workflow run release.yml --ref main`). A tag
# then never points at a commit whose installers are known to fail.
#
# REQUIRED SECRET — SEMANTIC_RELEASE_TOKEN
# A tag pushed using the default GITHUB_TOKEN would NOT trigger release.yml (GitHub
# suppresses workflow runs for events created by GITHUB_TOKEN), and the main
# ruleset rejects its direct push. The secret is a fine-grained PAT (contents:
# read/write on this repository) owned by an organization admin, the ruleset's
# bypass actor. A missing or expired token fails before anything is changed.

on:
  workflow_dispatch:

permissions:
  # contents: write is all the configured plugins need — to push the release commit
  # and tag. GitHub release creation is disabled here, so nothing
  # here comments on issues/PRs or creates a GitHub Release (release.yml does that),
  # hence no issues:/pull-requests: write grants. actions: read finds the candidate.
  contents: write
  actions: read

# Never run two releases at once; never cancel one mid-flight (a half-done release
# leaves a dangling tag).
concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  release:
    name: Create release (if warranted)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require main, a green candidate and a working release token
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Not main::Version Release only runs on main, got $REF."
            exit 1
          fi
          candidate="$(gh run list --repo "$REPOSITORY" --workflow release.yml             --branch main --event workflow_dispatch --commit "$SHA" --status success             --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$candidate" ]; then
            echo "::error title=No green Release candidate::main at $SHA has no successful Release candidate. Run: gh workflow run release.yml --ref main, wait for it to pass, then dispatch Version Release again."
            exit 1
          fi
          echo "Release candidate for $SHA: https://github.com/$REPOSITORY/actions/runs/$candidate"
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error title=No SEMANTIC_RELEASE_TOKEN::Add a fine-grained PAT (contents: read/write) as the SEMANTIC_RELEASE_TOKEN repository secret."
            exit 1
          fi
          if ! GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$REPOSITORY" --silent; then
            echo "::error title=SEMANTIC_RELEASE_TOKEN rejected::The release token is expired or lacks access to $REPOSITORY. Replace the SEMANTIC_RELEASE_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Conventional Commits can be analysed
          persist-credentials: true
          # The PAT makes the pushed tag trigger release.yml (see header).
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Configure release commit identity
        run: |
          git config user.name "Gykonik"
          git config user.email "gykonik@gmail.com"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        # The checkout keeps the release token in .git/config, so no dependency
        # install script may run here.
        run: npm ci --ignore-scripts

      - name: Audit release tooling
        run: npm audit --audit-level=high

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npm run release
