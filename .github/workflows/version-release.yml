name: Version Release

# Ships main as the next MediaSorter version in one manual dispatch:
#
#   gh workflow run version-release.yml --ref main -f dry_run=true   # preview only
#   gh workflow run version-release.yml --ref main                   # ship
#
#   1. Preview. Computes the next version from Conventional Commits since the
#      last `v*` tag and writes it, the changelog section and the commits it
#      covers to the run summary. Docs/tests-only history means nothing to
#      release. `dry_run` stops here and changes nothing.
#   2. Candidate. Requires a successful unpublished Release run (release.yml
#      dispatched on main) for this exact commit, so a tag never points at a
#      commit whose installers fail. It reuses one, or starts one and waits. A
#      failed candidate's failed jobs are retried once (runner network glitches
#      happen); a second failure stops the release with nothing changed.
#   3. Tag. release-it syncs the version (scripts/sync-version.mjs), updates
#      CHANGELOG.md, commits `chore(release): vX.Y.Z` to main and pushes the tag
#      atomically. If main moved meanwhile, the push is refused and nothing ships.
#   4. Publish. The tag triggers release.yml, which rebuilds the tagged commit,
#      repeats every gate and publishes the GitHub Release.
#
# Versioning and building stay separate workflows: the token that may push to
# main exists only in this short job, never in the long builds that run
# third-party tooling, and a tag can be rebuilt without minting a new version.
#
# REQUIRED — the fileworks-release GitHub App
# A tag pushed using the default GITHUB_TOKEN would NOT trigger release.yml (GitHub
# suppresses workflow runs for events created by GITHUB_TOKEN), and the main
# ruleset rejects its direct push. The org-owned fileworks-release App (contents:
# read/write, installed on this repository, the ruleset's bypass actor) pushes
# instead: the RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY secret
# mint a one-hour installation token, so no personal token is stored. A missing
# or misconfigured App fails before anything is changed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only preview the next version and changelog; change nothing
        type: boolean
        default: false

permissions:
  # The job's own GITHUB_TOKEN only reads the repository and finds, starts and
  # retries the Release candidate. The release commit and tag are pushed with
  # the App token, and release.yml creates the GitHub Release.
  contents: read
  actions: write

# Never run two releases at once; never cancel one mid-flight (a half-done release
# leaves a dangling tag).
concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.dry_run && 'Preview the next release' || 'Release main (if warranted)' }}
    runs-on: ubuntu-24.04
    # A candidate build takes up to about an hour and may be retried once.
    timeout-minutes: 180
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Not main::Version Release only runs on main, got $GITHUB_REF."
          exit 1

      - name: Require the release App configuration
        if: ${{ !inputs.dry_run }}
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ "$PRIVATE_KEY_SET" != true ]; then
            echo "::error title=Release App not configured::Share the RELEASE_APP_CLIENT_ID organization variable and RELEASE_APP_PRIVATE_KEY organization secret with this repository."
            exit 1
          fi

      # Fail fast: proves the App is installed here before the long candidate
      # wait. This token is read-only; the push mints its own below because a
      # token lives one hour and must not exist during installs and builds.
      - name: Require a working release App
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so Conventional Commits can be analysed
          # No push credential exists until the tag step, so neither the
          # tooling install nor the candidate wait can see one.
          persist-credentials: false

      - name: Configure release commit identity
        run: |
          git config user.name "Gykonik"
          git config user.email "gykonik@gmail.com"

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        # Release tooling runs where the push token later exists, so no
        # dependency install script may run.
        run: npm ci --ignore-scripts

      - name: Audit release tooling
        run: npm audit --audit-level=high

      - name: Preview the next version
        id: preview
        run: |
          set -euo pipefail
          previous="$(git describe --tags --match='v*' --abbrev=0 HEAD)"
          version=""
          if [ "$(git rev-list --count "$previous..HEAD")" != 0 ]; then
            # Prints nothing when only docs/tests changed; fails when material
            # changes have no feat/fix/perf record (see scripts/releaseability.cjs).
            version="$(npx --no-install release-it --ci --release-version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            if [ -z "$version" ]; then
              echo "## Nothing to release"
              echo
              echo "main has no releasable changes since \`$previous\`."
            else
              echo "## Next release: v$version"
              echo
              echo "Previous release: \`$previous\`. Commit: \`$GITHUB_SHA\`."
              echo
              npx --no-install release-it --ci --changelog
              echo
              echo "<details><summary>Commits since $previous</summary>"
              echo
              git log --format='- %h %s' "$previous..HEAD"
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Next version: ${version:-none (nothing to release)}"

      - name: Require a green Release candidate for this commit
        if: ${{ !inputs.dry_run && steps.preview.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release candidates for exactly this commit, newest first.
          candidates() {
            gh run list --workflow release.yml --branch main --event workflow_dispatch               --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion "$@"
          }
          newest() { candidates --jq '.[0].databaseId // empty'; }
          run="$(candidates --jq 'map(select(.conclusion == "success"))[0].databaseId // empty')"
          if [ -z "$run" ]; then
            run="$(candidates --jq 'map(select(.status != "completed"))[0].databaseId // empty')"
          fi
          if [ -z "$run" ]; then
            before="$(newest)"
            echo "No candidate for $GITHUB_SHA yet; starting one."
            started="$(gh workflow run release.yml --ref main 2>&1)"
            echo "$started"
            # Current gh prints the new run's URL; otherwise find it by polling.
            run="$(grep -oE 'actions/runs/[0-9]+' <<< "$started" | head -n 1 | cut -d/ -f3 || true)"
            for _ in $(seq 1 30); do
              [ -n "$run" ] && break
              sleep 10
              run="$(newest)"
              if [ -n "$run" ] && [ "$run" != "$before" ]; then break; fi
              run=""
            done
            if [ -z "$run" ]; then
              echo "::error title=Candidate did not start::No Release run appeared for $GITHUB_SHA."
              exit 1
            fi
          fi
          retried=false
          for _ in $(seq 1 5); do
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "Release candidate: $url"
            gh run watch "$run" --interval 60 > /dev/null || true
            conclusion="$(gh run view "$run" --json conclusion --jq .conclusion)"
            case "$conclusion" in
              success)
                echo "Release candidate: [$run]($url) passed." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              cancelled)
                # A newer dispatch of the same commit supersedes this one: follow
                # it. One for another commit means main moved, so stop.
                replacement="$(newest)"
                if [ -z "$replacement" ] || [ "$replacement" = "$run" ]; then
                  echo "::error title=Release candidate cancelled::$url was cancelled; nothing was tagged."
                  exit 1
                fi
                echo "Candidate $run was superseded by $replacement."
                run="$replacement"
                ;;
              *)
                if [ "$retried" = true ]; then
                  echo "::error title=Release candidate failed::$url failed twice; nothing was tagged."
                  exit 1
                fi
                echo "::warning title=Candidate failed once::Retrying the failed jobs of $url once."
                gh run rerun "$run" --failed
                retried=true
                sleep 30
                ;;
            esac
          done
          echo "::error title=Release candidate unresolved::Gave up following candidates for $GITHUB_SHA."
          exit 1

      - name: Mint the release push token
        id: release-app
        if: ${{ !inputs.dry_run && steps.preview.outputs.version != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag the release
        if: ${{ !inputs.dry_run && steps.preview.outputs.version != '' }}
        env:
          RELEASE_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          set -euo pipefail
          # The App token (not GITHUB_TOKEN) makes the pushed tag trigger
          # release.yml; the action revokes it when the job ends.
          basic="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git config --local "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $basic"
          npm run release
          tag="v$VERSION"
          if [ "$(git describe --tags --exact-match HEAD)" != "$tag" ]; then
            echo "::error title=Unexpected version::release-it did not tag the previewed $tag."
            exit 1
          fi
          echo "Tagged \`$tag\`; release.yml now builds and publishes it:" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml?query=branch%3A$tag" \
            >> "$GITHUB_STEP_SUMMARY"
