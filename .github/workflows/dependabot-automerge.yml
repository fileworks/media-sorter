# Generated from maintenance/dependabot.py. Edit the generator, not this file.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable protected squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          # The release token is deliberately used when available: merges made
          # by GITHUB_TOKEN do not emit the push event that post-merge quality
          # and release workflows consume. The actor/base guards above keep the
          # credential unavailable to arbitrary pull requests.
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
