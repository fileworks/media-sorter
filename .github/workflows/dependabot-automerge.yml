# Generated from maintenance/dependabot.py. Edit the generator, not this file.
name: Dependabot auto-merge

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    if: github.repository_owner == 'fileworks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Queue mature, green Dependabot squash merges
        run: |
          gh pr list \
            --state open \
            --author app/dependabot \
            --limit 100 \
            --json url,createdAt,statusCheckRollup \
            --jq '
              .[]
              | select((fromdateiso8601(.createdAt)) <= (now - 604800))
              | select((.statusCheckRollup | length) > 0)
              | select(all(.statusCheckRollup[]; .status == "COMPLETED" and .conclusion == "SUCCESS"))
              | .url' |
          while IFS= read -r pr_url; do
            [ -n "$pr_url" ] || continue
            gh pr merge --auto --squash "$pr_url"
          done
        env:
          # A scheduled base-branch workflow can safely use the existing release
          # credential without exposing it to Dependabot-authored workflow code.
          # Unlike GITHUB_TOKEN, it preserves post-merge push/release events.
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
