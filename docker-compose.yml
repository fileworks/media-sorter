services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mediasort-backend:dev
    container_name: mediasort-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist config.json and mediasort.db across restarts
      - mediasort-config:/config
      # Bind-mount media directories from the host.
      # Override via .env or shell exports: MEDIA_SOURCE=~/Pictures MEDIA_DEST=~/Sorted
      - type: bind
        source: ${MEDIA_SOURCE:-/tmp/media_source}
        target: /media/source
        read_only: true
      - type: bind
        source: ${MEDIA_DEST:-/tmp/media_dest}
        target: /media/dest
    environment:
      MEDIASORT_CONFIG_DIR: /config
      MEDIASORT_DATA_DIR: /config
      MEDIASORT_DB_PATH: /config/mediasort.db
      MEDIASORT_LOG_DIR: /config/logs
      MEDIASORT_LOG_LEVEL: "${MEDIASORT_LOG_LEVEL:-INFO}"
      MEDIASORT_API_CAPABILITY: "${MEDIASORT_API_CAPABILITY:?Set a fresh capability of at least 32 characters}"
      # Uncomment to pre-configure source/dest inside the container:
      # MEDIASORT_SOURCE_DIRECTORY: /media/source
      # MEDIASORT_TARGET_DIRECTORY: /media/dest
    healthcheck:
      # Authenticate using the same capability as the backend; never print it.
      test:
        - "CMD"
        - "python"
        - "-m"
        - "app.core.container_health"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mediasort-config:
    driver: local
