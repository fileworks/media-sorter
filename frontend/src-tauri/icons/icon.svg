<!--
  Bundle master for the OS icon set (dock, taskbar, installer, tray).

  Same mark as the in-app one — rounded frame, folder outline, accent arrow —
  with the strokes optically corrected: at 16 px a 2/48 stroke lands on two
  thirds of a pixel and greys out, so the bundle master carries 2.75 and a
  marginally larger arrow. The 48 px in-app mark stays at the design's 2.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MediaSorter">
  <title>MediaSorter</title>
  <rect x="0" y="0" width="48" height="48" rx="12.5" fill="#efeae2"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.9" fill="none" stroke="#ded7cb" stroke-width="1.5"/>
  <g fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 36.25V19.75a2.25 2.25 0 012.25-2.25h7.25l3.1 3.1h14.15a2.25 2.25 0 012.25 2.25v13.4a2.25 2.25 0 01-2.25 2.25H11.75a2.25 2.25 0 01-2.25-2.25z" stroke="#2a251f"/>
    <path d="M24 7.25v8M20.15 11.4L24 15.25l3.85-3.85" stroke="#e8582a"/>
  </g>
</svg>
