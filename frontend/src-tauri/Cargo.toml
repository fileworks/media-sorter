[package]
name = "media-sorter"
version = "1.4.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
ureq = "3"
native-dialog = "0.9.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
