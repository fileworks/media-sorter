<!--
  Canonical desktop artwork based on the approved MediaSorter Kontur mark.

  Two numbers, and `scripts/generate_branding.py` asserts both against the
  rendered PNG, because the icon has repeatedly shipped at the wrong size:
  geometry that only lives in an opaque approved blob drifts, and nothing
  catches it.

  `scale(0.8047)` insets the tile to 824/1024 of the canvas — Apple's
  documented macOS grid. An earlier revision used 744/1024 on the reasoning
  that macOS composites no mask over an `.icns`, so a smaller tile is a
  smaller icon. That stopped being true: macOS 26 normalises every legacy
  `.icns` into the standard squircle plate, scaling the artwork's opaque
  bounds to 824/1024 whatever they were authored at. Measured with
  `NSWorkspace.icon(forFile:)` on 26.6, this app and Mail, Notes, Terminal and
  VS Code all render their plate at exactly 412px of 512. So the tile ratio no
  longer changes the icon's size in the dock at all — it only decides whether
  macOS upscales to get there, and what Windows and Linux, which do not
  normalise, are handed. Both argue for the documented grid.

  `scale(1.45)` grows the mark about the same centre, independently. This is
  the number that is actually visible on macOS now: inside a plate whose size
  the system fixes, only the drawing's share of it can read as large or small,
  and at the previous 1.28 the mark floated in a wide cream field and read as
  undersized next to its neighbours. Its stroke scales with it, so the mark
  keeps its own proportions and only its size relative to the tile changes.

  `translate(7.849 6.79)` is not the 8/8 the mark is authored at. The Kontur
  glyph is bottom-heavy and sits low and right in its own 32-unit box. The
  offset puts the rendered ink's centre on (24, 24) — the centre both scales
  above are taken about, so the mark stays centred at any scale.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="t">
  <title id="t">MediaSorter · Kontur</title>
  <g transform="translate(24 24) scale(0.8047) translate(-24 -24)">
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.9" fill="#EFEAE2" stroke="#DED7CB" stroke-width="1.5"/>
    <g transform="translate(24 24) scale(1.45) translate(-24 -24)">
      <g transform="translate(7.849 6.79)" fill="none" stroke="#2A251F" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.6 11a2.4 2.4 0 0 1 2.4-2.4h4.8l2.5 2.9h11a2.4 2.4 0 0 1 2.4 2.4v9.5a2.4 2.4 0 0 1-2.4 2.4H7a2.4 2.4 0 0 1-2.4-2.4z"/>
        <path stroke="#E8582A" d="M16 15.2v6.2m-2.8-2.8 2.8 2.8 2.8-2.8"/>
      </g>
    </g>
  </g>
</svg>
