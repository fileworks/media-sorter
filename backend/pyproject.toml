[project]
name = "mediasort-backend"
# Derived from app/_version.py (the single source of truth, bumped by
# scripts/sync-version.mjs on release) via hatchling's dynamic-version hook below.
dynamic = ["version"]
description = "MediaSorter — intelligent media organisation backend"
authors = [
    {name = "Niklas Büchel", email = "gykonik@gmail.com"}
]
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.6",
    "websockets>=16.1.1",

    # Configuration & validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.11.0",

    # Logging
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",

    # Image processing
    "pillow>=12.3.0",
    "piexif>=1.1.3",
    "imagehash>=4.3.1",
    # HEIC/HEIF support (registers a Pillow plugin)
    "pillow-heif>=1.5.0",
    # RAW decoding (bundles libraw via the wheel)
    "rawpy>=0.18.0",
    # rawpy.postprocess returns an ndarray that PIL.Image.fromarray consumes; pin explicitly
    "numpy>=1.24.0",

    # HTTP
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",

    # Utilities
    "filetype>=1.2.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    # Ruff is the single linter + formatter (replaces black + isort + pylint).
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "httpx>=0.25.0",
    # Bundling — used by `make bundle-backend` to freeze the backend for distribution
    "pyinstaller>=6.21.0",
]

# Local, offline AI tagging (CLIP/SigLIP zero-shot + GPS geocoding). Optional so
# CI/tests and the cloud-only path don't pull onnxruntime; release builds freeze
# the inference runtime but never model weights. Those are installed explicitly
# from immutable, checksum-covered sources. fastembed provides the CLIP runtime
# without torch and does not pin pillow/numpy, so it coexists with pillow-heif/rawpy.
# reverse_geocoder bundles the GeoNames dataset (~26 MB) for offline GPS → city
# name resolution — no network needed at runtime.
local-ai = [
    "fastembed>=0.8.0",
    "reverse_geocoder>=1.5.1",
    # SigLIP 2 ("standard"/"max" tiers): onnxruntime runs the towers and
    # tokenizers loads the Gemma tokenizer. huggingface_hub remains an explicit
    # runtime dependency for fastembed compatibility, but application code
    # disables its network path and passes only verified local component paths.
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface_hub>=1.26.0",
    # Reliable cross-platform RAM detection for the hardware tier probe (the
    # probe degrades gracefully without it, but psutil avoids per-OS fallbacks).
    "psutil>=5.9.0",
]

[tool.hatch.version]
path = "app/_version.py"

[tool.uv]
# Security floors for runtime-transitive packages that are not part of the
# backend's public import surface. Keep them here so every shipped extra set is
# resolved above known vulnerable releases without pretending they are direct
# application dependencies.
constraint-dependencies = [
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Lets test modules in subdirectories import the shared helpers in tests/support.py.
pythonpath = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
# Same scope as the sibling CLI repos. The suite is the thing that says the
# product is correct, so it is held to the product's standard: a fixture that
# quietly returns the wrong shape is a test that proves nothing.
files = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A pragmatic, recommended rule set: pyflakes (F) + pycodestyle (E/W) catch real
# bugs and style; isort (I) replaces the old isort; pyupgrade (UP), bugbear (B),
# comprehensions (C4) and simplify (SIM) are high-signal, low-noise.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests favour explicit, repetitive setup over clever refactors.
"tests/**" = ["B011", "SIM"]
